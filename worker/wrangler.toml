"$schema" = "./node_modules/wrangler/config-schema.json"
name = "bem-vindo-api"
main = "src/index.ts"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# Günlük kotanın sayısal tavanı. Sayaç henüz kalıcı değil; bkz. src/usage.ts.
[vars]
IMAGE_DAILY_LIMIT = "120"
SCENE_DAILY_LIMIT = "300"

# Değerler wrangler secret put ile verilir. Repoda ve bu dosyada yok.
[secrets]
required = ["XAI_API_KEY", "DEVICE_TOKENS"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
